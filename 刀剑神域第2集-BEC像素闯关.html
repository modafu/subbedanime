.topbar{position:sticky;top:0;z-index:5;border-bottom:2px solid rgba(169,145,255,.25);background:rgba(23,23,44,.94);backdrop-filter:blur(12px)}.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:76px}.brand{display:flex;align-items:center;gap:12px;min-width:225px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;color:var(--night);background:var(--gold);border:3px solid #fff1bd;box-shadow:4px 4px 0 #090914;font-size:22px;transform:rotate(-3deg)}.brand-name{font-weight:950;letter-spacing:.08em;font-size:15px}.brand-sub{color:var(--muted);margin-top:3px;font-size:11px;letter-spacing:.12em}

main{padding:34px 0 72px;min-height:calc(100vh - 150px)}.eyebrow{color:var(--cyan);font-size:12px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}h1,h2,h3,p{margin-top:0}h1{margin-bottom:14px;font-size:clamp(34px,6vw,64px);line-height:1.04;letter-spacing:-.045em}h2{font-size:clamp(22px,3vw,32px);margin-bottom:9px}h3{font-size:17px}.muted{color:var(--muted)}.pixel-card{background:var(--panel);border:2px solid var(--line);box-shadow:var(--shadow)}
.hero{overflow:hidden;position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,.75fr);gap:25px;align-items:center;padding:clamp(24px,5vw,52px);border-color:#6f63a3;background:linear-gradient(135deg,rgba(75,62,121,.92),rgba(36,36,61,.97) 58%)}.hero:after{content:"✦";position:absolute;top:12px;right:20px;color:rgba(255,207,112,.38);font-size:90px;line-height:1}.hero-copy,.hero-art{position:relative;z-index:1}.hero-copy p{color:#d5d2e7;line-height:1.8;max-width:620px}.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.button{min-height:48px;padding:12px 18px;border:2px solid transparent;cursor:pointer;font-weight:950;transition:transform .12s ease,filter .12s ease}.button:hover{transform:translate(-2px,-2px);filter:brightness(1.08)}.button:active{transform:translate(2px,2px)}.button.primary{color:#17172c;background:var(--gold);border-color:#fff1bd;box-shadow:4px 4px 0 #090914}.button.secondary{color:var(--ink);background:var(--panel2);border-color:#66668d;box-shadow:4px 4px 0 #090914}.button.ghost{color:var(--cyan);background:transparent;border-color:var(--line)}.button:disabled{cursor:not-allowed;opacity:.55;transform:none}
.dungeon-scene{min-height:210px;display:grid;place-items:center;position:relative}.tower{position:relative;width:132px;height:170px;border:5px solid #111121;background:linear-gradient(90deg,#6b63a4 0 20%,#9486ce 20% 80%,#6b63a4 80%);box-shadow:9px 9px 0 #111121,inset 0 0 0 5px #c2b6ff;clip-path:polygon(50% 0,100% 24%,92% 100%,8% 100%,0 24%)}.tower:before{content:"";position:absolute;left:35px;top:24px;width:16px;height:25px;background:var(--cyan);box-shadow:44px 0 var(--cyan),0 47px var(--gold),44px 47px var(--gold);border:3px solid #262442}.tower:after{content:"";position:absolute;bottom:0;left:45px;width:34px;height:53px;border:4px solid #282448;background:#2a2545;border-bottom:0}.scene-label{position:absolute;bottom:4px;padding:5px 10px;color:#111121;background:var(--cyan);border:2px solid #d4fffa;font-size:11px;font-weight:950;letter-spacing:.1em}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.stat-card{padding:17px 19px}.stat-label{color:var(--muted);font-size:12px;letter-spacing:.09em}.stat-value{margin-top:7px;font-size:27px;font-weight:950}.gold{color:var(--gold)}.cyan{color:var(--cyan)}.rose{color:var(--rose)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:34px 0 16px}.section-head p{margin:0;color:var(--muted);font-size:13px}.quick-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mini-card{padding:18px;min-height:150px}.mini-card .icon{font-size:24px;margin-bottom:11px}.mini-card p{color:var(--muted);line-height:1.65;font-size:13px;margin-bottom:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:20px 0}.toolbar input,.toolbar select{min-height:46px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 13px}.toolbar input{flex:1 1 280px}.toolbar select{min-width:200px}.map-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.floor-card{padding:16px;min-height:164px;display:flex;flex-direction:column;gap:9px}.floor-top{display:flex;justify-content:space-between;align-items:center}.floor-number{color:var(--gold);font-size:12px;font-weight:950;letter-spacing:.12em}.floor-card h3{margin:0;font-size:15px}.floor-card p{margin:0;color:var(--muted);font-size:12px}.progress-track{height:8px;background:#17172c;border:1px solid #545477;margin-top:auto}.progress-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}.floor-card .button{min-height:38px;padding:8px 10px;font-size:12px}
.quiz-shell{max-width:800px;margin:0 auto}.quiz-top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:13px;color:var(--muted);font-size:13px}.quiz-track{height:10px;border:2px solid var(--line);background:var(--panel);margin-bottom:20px}.quiz-track span{display:block;height:100%;background:var(--cyan);transition:width .2s}.question-card{padding:clamp(20px,5vw,36px)}.question-label{color:var(--gold);font-size:12px;font-weight:950;letter-spacing:.14em}.question-prompt{margin:17px 0 22px;font-size:clamp(20px,3vw,27px);line-height:1.65;overflow-wrap:anywhere}.quote-line{padding:16px;background:#1b1b30;border-left:4px solid var(--violet);font-size:18px;line-height:1.7}.answer-list{display:grid;gap:10px;margin-top:22px}.answer-option{text-align:left;width:100%;padding:14px 16px;background:var(--panel2);border:2px solid #515178;cursor:pointer;line-height:1.65}.answer-option:hover:not(:disabled){border-color:var(--cyan);background:#353553}.answer-option.correct{border-color:var(--green);color:var(--green);background:rgba(67,129,85,.16)}.answer-option.incorrect{border-color:var(--rose);color:#ffc2ce;background:rgba(153,57,83,.15)}
.feedback{margin-top:18px;padding:17px;border:2px solid var(--line);background:#1b1b30;line-height:1.7}.feedback.good{border-color:#4d9c69}.feedback.bad{border-color:#a65870}.feedback p:last-child{margin-bottom:0}.quiz-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}.results-card{padding:clamp(24px,5vw,42px);text-align:center}.results-score{color:var(--gold);font-size:clamp(42px,9vw,72px);font-weight:950;margin:12px 0}.results-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:25px}
.library-list{display:grid;gap:12px}.entry-card{padding:18px 20px}.entry-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:11px;margin-bottom:12px}.tag{padding:4px 8px;border:1px solid #69638c;color:var(--violet);background:#302c49}.entry-field{display:grid;grid-template-columns:125px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid rgba(139,139,176,.18);line-height:1.7}.field-name{color:var(--cyan);font-size:12px;font-weight:900}code{color:#ffe4a7;background:rgba(255,207,112,.09);padding:1px 4px}.appendix-card{padding:22px;margin-top:20px;line-height:1.8}.appendix-card h2{margin-top:18px;color:var(--gold)}.appendix-card h2:first-child{margin-top:0}.appendix-card li{margin:9px 0}.appendix-card blockquote{margin:14px 0;padding:12px 16px;border-left:4px solid var(--cyan);background:#1b1b30}.archive{margin-top:18px;border:2px solid var(--line);background:#1b1b30}.archive summary{padding:14px 16px;color:var(--cyan);cursor:pointer;font-weight:900}.archive pre{max-height:560px;overflow:auto;padding:18px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#d9d6e9;line-height:1.65;font:12px/1.7 ui-monospace,monospace;border-top:1px solid var(--line)}
.empty-state{padding:34px;text-align:center;color:var(--muted)}.notice{padding:13px 16px;color:#e8daaa;border:1px solid #776b40;background:rgba(139,119,51,.12);font-size:13px;line-height:1.7}.reset-row{display:flex;justify-content:flex-end;margin-top:28px}.tiny-button{border-color:var(--line)}footer{padding:20px 0 30px;border-top:1px solid rgba(139,139,176,.2);color:var(--muted);font-size:11px;text-align:center}.toast{position:fixed;left:50%;bottom:24px;z-index:10;transform:translateX(-50%);max-width:calc(100% - 30px);padding:12px 18px;color:var(--night);background:var(--cyan);border:2px solid white;box-shadow:4px 4px 0 #090914;font-size:13px;font-weight:900}
@media(max-width:850px){.topbar-inner{align-items:flex-start;flex-direction:column;padding:13px 0;gap:12px}.nav{justify-content:flex-start;width:100%}.nav button{padding:8px 9px}.map-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.shell{width:min(100% - 22px,1120px)}main{padding-top:21px}.hero{grid-template-columns:1fr}.dungeon-scene{min-height:150px}.tower{transform:scale(.8)}.stats-grid,.quick-row{grid-template-columns:1fr}.stat-card{padding:13px 15px}.stat-value{font-size:23px}.map-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.floor-card{padding:12px;min-height:158px}.entry-card{padding:15px}.entry-field{grid-template-columns:1fr;gap:3px}.quiz-footer{align-items:stretch;flex-direction:column}.quiz-footer .button{width:100%}.nav{gap:3px}.nav button{font-size:12px}}

<script>
const DATA = {"title":"刀剑神域第 2 集 × BEC 口语词搭训练","materials":"- **动漫 TXT：** `2-2.ビーター   封弊者-1080P 高清-AVC.txt`，按文件现有时间戳顺序处理。原文件是时间戳分段的转写，含 ASR 错字、残句和中文混入；下文保留可辨认的英文原样，问题处标“转写疑似有误”，不擅自修成另一个原句。纯中文片段略过。\n- **随机抽取的 BEC 资料：** `[BEC中级Lesson47]phonetic alphabet.pdf`，第 1 页。内容是 NATO 和 Western Union 拼读字母表。这份资料与动漫主线没有直接词搭重合，因此只在电话确认姓名、编号时作补充迁移；表格里其余商务例句均标“通用原创”，不冒称来自 BEC。\n- **钱多多标签：** 每句选一个主要思维类目。标签只作记忆提示，不是评分。","chapters":[{"timestamp":"00:00:11.960","entries":[{"id":"entry-001","dialogue":"Since the game began, a whole month has gone by and two thousand people have died so far.","collocation":"`since ... began`；时间","meaning":"游戏开始以来，已经过去整整一个月，到目前为止已有两千人死亡。","business":"Since the project began, we have completed the first testing phase.（通用原创）"},{"id":"entry-002","dialogue":"After all this time, none of the players have been able to clear floor one.","collocation":"`have been able to`；欲望／作用","meaning":"这么久以来，没有玩家能通过第一层。","business":"We haven't been able to reproduce the issue yet.（通用原创）"},{"id":"entry-003","dialogue":"I used to be a beta tester and even I haven't found out where the boss is, hilarious.","collocation":"`find out where ... is`；探索／经历","meaning":"我以前是测试玩家，连我都没找到 Boss 在哪儿——原转写末尾 `hilarious` 可能是断句或识别问题。","business":"We need to find out where the data mismatch starts.（通用原创）"},{"id":"entry-004","dialogue":"And today finally we're having a meeting to figure out how to find and defeat the floor one boss.","collocation":"`have a meeting to figure out`；场景","meaning":"今天终于要开会，想办法找到并击败第一层 Boss。","business":"We're having a meeting to figure out how to resolve the launch issue.（通用原创）"}]},{"timestamp":"00:00:59.940","entries":[{"id":"entry-005","dialogue":"气氛，所以。I give you everything I.","collocation":"`give you ...`；欲望／作用","meaning":"前半句是中文混入；英文是转写残句，原样保留，意思不完整。","business":"I can give you a quick update after the test.（通用原创）"},{"id":"entry-006","dialogue":"Okay people, now that everyone's here let's get this meeting started.","collocation":"`get this meeting started`；场景","meaning":"好了，大家都到了，我们开始开会。","business":"Now that everyone's here, let's get the project review started.（通用原创）"},{"id":"entry-007","dialogue":"So anyway, I want to thank everyone for coming.","collocation":"`thank everyone for coming`；人物","meaning":"总之，感谢大家到场。","business":"I'd like to thank everyone for joining today's customer call.（通用原创）"},{"id":"entry-008","dialogue":"Good to see you.","collocation":"`good to see you`；人物","meaning":"很高兴见到你。","business":"Good to see you again. Could we review the open items?（通用原创）"},{"id":"entry-009","dialogue":"My name is diabel and in this game the job I rolled is knight.","collocation":"`My name is ...`；人物","meaning":"我叫 Diabel；在这个游戏里，我抽到的职业是骑士。人名和 `job I rolled` 按转写保留。","business":"My name is Alex, and I'll coordinate the implementation schedule.（通用原创）"},{"id":"entry-010","dialogue":"Dude there's no job system in this game.","collocation":"`there's no ... system`；场景","meaning":"伙计，这游戏没有职业系统。","business":"There's no separate approval system for this test environment.（通用原创）"},{"id":"entry-011","dialogue":"You guys want to hear this or not.","collocation":"`want to hear ... or not`；欲望／作用","meaning":"你们到底想不想听？语气较冲，不建议照搬到职场。","business":"Would you like me to walk you through the test results?（通用原创）"}]},{"timestamp":"00:02:39.840","entries":[{"id":"entry-012","dialogue":"Right anyway, here's the deal.","collocation":"`here's the deal`；场景","meaning":"好了，重点是这样。口语、直接。","business":"Here's the current status: the test is complete, but one issue remains.（通用原创）"},{"id":"entry-013","dialogue":"Our party found the boss room at the top of the tower today.","collocation":"`at the top of ...`；地点","meaning":"我们队今天在塔顶找到了 Boss 房间。","business":"The latest test results are at the top of the report.（通用原创）"},{"id":"entry-014","dialogue":"First we need to defeat the boss and make it to floor two.","collocation":"`make it to ...`；欲望／作用","meaning":"首先要击败 Boss，进入第二层。","business":"We need to finish the user test and make it to the next project phase.（通用原创）"},{"id":"entry-015","dialogue":"The next step is we have to tell everyone waiting in the town of beginnings that it is possible to beat this game.","collocation":"`the next step is ...`；探索／经历","meaning":"下一步是告诉起始之镇等待的人，游戏是可以通关的。","business":"The next step is to confirm the test scope with the customer.（通用原创）"},{"id":"entry-016","dialogue":"Fact is, it's our duty as the most capable players here.","collocation":"`it's our duty to ...`；欲望／作用","meaning":"事实上，作为这里能力最强的玩家，这是我们的责任。","business":"It's our duty to keep the customer informed about major risks.（通用原创）"},{"id":"entry-017","dialogue":"Do you agree or not?","collocation":"`Do you agree ...?`；感受","meaning":"你同不同意？","business":"Do you agree with the proposed testing schedule?（通用原创）"},{"id":"entry-018","dialogue":"Okay, glad to hear you're all with me on this.","collocation":"`glad to hear ...`；感受","meaning":"好，很高兴听到大家都支持这件事。","business":"I'm glad to hear the team can support the revised plan.（通用原创）"},{"id":"entry-019","dialogue":"Now let's figure out how we're gonna beat the boss.","collocation":"`figure out how to ...`；探索／经历","meaning":"现在来想想怎样击败 Boss。","business":"Let's figure out how to fix the login issue before launch.（通用原创）"},{"id":"entry-020","dialogue":"First off, we'll team up into parties of six.","collocation":"`team up into ...`；人物","meaning":"首先，我们六人组队。","business":"We'll team up into two groups to test the new workflow.（通用原创）"},{"id":"entry-021","dialogue":"Of course a typical party doesn't stand a chance against a floor boss.","collocation":"`stand a chance against ...`；欲望／作用","meaning":"普通队伍当然没机会对付楼层 Boss。","business":"Our current setup may not stand a chance against the peak-load scenario.（通用原创）"},{"id":"entry-022","dialogue":"Why?","collocation":"`Why?`；探索／经历","meaning":"为什么？单独问句，无固定词搭。","business":"Why did the test fail?（通用原创）"},{"id":"entry-023","dialogue":"We need a raid group made up of multiple parties.","collocation":"`made up of ...`；人物","meaning":"我们需要一支由多个队伍组成的突击队。","business":"The project team is made up of engineers from three departments.（通用原创）"},{"id":"entry-024","dialogue":"Let's do this.","collocation":"`Let's do this`；欲望／作用","meaning":"开始行动吧。","business":"The plan is ready. Let's do this.（通用原创）"}]},{"timestamp":"00:03:40.320","entries":[{"id":"entry-025","dialogue":"You got left out too, huh?","collocation":"`be left out`；人物","meaning":"你也被落下、没被算进去吗？","business":"Were you left out of the project update email?（通用原创）"},{"id":"entry-026","dialogue":"Not even.","collocation":"`not even`；感受","meaning":"才不是呢。简短回应。","business":"Not even close—we still need to verify the data.（通用原创）"},{"id":"entry-027","dialogue":"I wasn't left out.","collocation":"`wasn't left out`；人物","meaning":"我没有被落下。","business":"I wasn't left out of the review; I joined the call late.（通用原创）"},{"id":"entry-028","dialogue":"It's just everyone seems like they're already friends.","collocation":"`seem like ...`；感受","meaning":"只是大家看起来早就认识、关系很好。","business":"It seems like the two teams already use different versions of the file.（通用原创）"},{"id":"entry-029","dialogue":"So you're solo too?","collocation":"`solo`；人物","meaning":"所以你也是一个人？`solo` 是口语表达。","business":"Are you working on the site check solo, or is someone joining you?（通用原创）"},{"id":"entry-030","dialogue":"You want to form a party with me?","collocation":"`form a ... with me`；人物","meaning":"你想和我组队吗？","business":"Would you like to form a small team with me for the user test?（通用原创）"}]},{"timestamp":"00:03:54.440","entries":[{"id":"entry-031","dialogue":"You heard what the guy just said?","collocation":"`what ... just said`；场景","meaning":"你听到他刚才说什么了吗？","business":"Did you hear what the customer just said about the delivery date?（通用原创）"},{"id":"entry-032","dialogue":"We can't beat the boss on our own and it would only be for this fight.","collocation":"`on our own`；人物","meaning":"我们自己打不过 Boss，而且只是为了这场战斗临时组队。","business":"We can't complete the site acceptance on our own; we need the customer's sign-off.（通用原创）"},{"id":"entry-033","dialogue":"All right, looks like everyone's teamed up now then.","collocation":"`looks like ...`；场景","meaning":"好，看起来大家现在都组好队了。","business":"It looks like everyone's reviewed the updated checklist.（通用原创）"},{"id":"entry-034","dialogue":"Hold up a sec.","collocation":"`hold up a sec`；时间","meaning":"等一下。口语化、较随意。","business":"Hold up a second—I want to confirm the serial number.（通用原创）"}]},{"timestamp":"00:04:23.360","entries":[{"id":"entry-035","dialogue":"My name's kibao.","collocation":"`My name's ...`；人物","meaning":"我叫 Kibao。人名按转写保留。","business":"My name's Alex, and I'm here to support the system test.（通用原创）"},{"id":"entry-036","dialogue":"Got that?","collocation":"`Got that?`；场景","meaning":"听明白了吗？语气比较强硬。","business":"Could you confirm that the revised date is clear?（通用原创）"},{"id":"entry-037","dialogue":"Before we take on the boss, I want to get something off my chest.","collocation":"`get something off my chest`；感受","meaning":"在挑战 Boss 前，我想把憋在心里的话说出来。","business":"Before we begin, I want to raise one concern about the test plan.（通用原创）"},{"id":"entry-038","dialogue":"We all know about the two thousand people who've died so far?","collocation":"`so far`；时间","meaning":"到目前为止死去的两千人，大家都知道吧？","business":"We have found three data issues so far.（通用原创）"},{"id":"entry-039","dialogue":"Yeah.","collocation":"无固定词搭；感受","meaning":"嗯／是的。","business":"Yes, I understand the issue.（通用原创）"},{"id":"entry-040","dialogue":"Well, some of you need to apologize to him right now.","collocation":"`right now`；时间","meaning":"有些人现在就该向他道歉。语气强，不宜直接用于客户沟通。","business":"We need to confirm the test owner now.（通用原创）"},{"id":"entry-041","dialogue":"Keep out.","collocation":"转写疑似有误；本句无可靠词搭","meaning":"原文件如此转写；可能是人名或被截断的话，无法可靠判断。","business":"Please keep the test area clear during the inspection.（通用原创，按字面功能迁移）"},{"id":"entry-042","dialogue":"I think I know who you're referring to.","collocation":"`refer to ...`；人物","meaning":"我想我知道你指的是谁。","business":"I think I know which test result you're referring to.（通用原创）"},{"id":"entry-043","dialogue":"You mean the ones who are ex beta testers, right?","collocation":"`You mean ... , right?`；人物","meaning":"你是说那些以前的 Beta 测试者，对吧？","business":"You mean the users who joined the pilot test, right?（通用原创）"},{"id":"entry-044","dialogue":"Of course I mean them.","collocation":"`I mean ...`；人物","meaning":"我当然是指他们。","business":"I mean the team responsible for the data migration.（通用原创）"},{"id":"entry-045","dialogue":"The day this stupid ass game started, the beta guys just up and vanished, right?","collocation":"`the day ... started`；时间","meaning":"这破游戏开始的那天，Beta 玩家就突然消失了，对吧？带粗俗情绪，职场不照搬。","business":"The day the rollout started, the support team began monitoring the system.（通用原创）"},{"id":"entry-046","dialogue":"They did stall us beginners, they snagged all the good hunting spots and they grabbed all the easy quests too.","collocation":"`grab ... too`；探索／经历","meaning":"转写称他们拖累新手、占了好狩猎点和简单任务；原句用词可能有识别问题。","business":"We should review the open tasks too before assigning the team.（通用原创）"},{"id":"entry-047","dialogue":"They were the only ones getting stronger in here this whole time.","collocation":"`the only ones ...`；人物","meaning":"这段时间里，只有他们一直在这里变强。","business":"They were the only team members testing the new build this week.（通用原创）"},{"id":"entry-048","dialogue":"They've ignored us like we're nothing.","collocation":"`ignore ...`；人物","meaning":"他们把我们当空气一样无视了。","business":"The supplier hasn't responded to our last two messages.（通用原创，表达相近事实）"},{"id":"entry-049","dialogue":"Hell, I bet there's some of them here.","collocation":"`I bet ...`；感受","meaning":"我敢说他们当中有人就在这里。","business":"I bet the customer will ask about the delivery date.（通用原创）"},{"id":"entry-050","dialogue":"Come on out beta testers.","collocation":"`come on out`；场景","meaning":"Beta 测试者，出来吧。","business":"Please come to the meeting room when you're ready.（通用原创，语用不同）"},{"id":"entry-051","dialogue":"We should make them apologize to us and we should make them all give up their money and the items they got.","collocation":"`make someone do ...`；欲望／作用","meaning":"我们应该让他们道歉，还要他们交出钱和拿到的物品。剧情里的强迫语气不适合职场。","business":"We should ask the vendor to provide the missing test records.（通用原创，改为礼貌请求）"},{"id":"entry-052","dialogue":"They can't expect the party to trust them when they don't trust us.","collocation":"`expect ... to ...`；感受","meaning":"他们不信任我们，却不能指望队伍信任他们。","business":"We can't expect users to trust the system until we've explained the data changes.（通用原创）"},{"id":"entry-053","dialogue":"Why should we?","collocation":"`Why should ...?`；探索／经历","meaning":"我们为什么要这样做？","business":"Why should we change the configuration before confirming the cause?（通用原创）"}]},{"timestamp":"00:05:29.320","entries":[{"id":"entry-054","dialogue":"Can I say something?","collocation":"`Can I say something?`；场景","meaning":"我能说几句吗？","business":"Can I add one point about the test results?（通用原创）"},{"id":"entry-055","dialogue":"Hey, my name's agio, keep out, right?","collocation":"`my name's ...`；人物","meaning":"转写疑似把人名和称呼识别错；原样保留，不确定应如何断句。","business":"My name's Alex. Could you confirm the project contact on your side?（通用原创）"},{"id":"entry-056","dialogue":"I want to make sure I'm on the same page.","collocation":"`be on the same page`；场景","meaning":"我想确认我们理解一致。","business":"I want to make sure we're on the same page about the acceptance criteria.（通用原创）"},{"id":"entry-057","dialogue":"You say the ex beta testers should be blamed for the rookie's deaths because they didn't help him, and you want them to apologize and give up their winnings?","collocation":"`give up ...`；欲望／作用","meaning":"你是说要把新手死亡归咎于老测试者，并让他们道歉、交出所得？长句；实际练习可拆开说。","business":"Are you asking the supplier to give up the disputed charge?（通用原创）"},{"id":"entry-058","dialogue":"I leave anything out?","collocation":"`leave anything out`；探索／经历","meaning":"我有遗漏什么吗？","business":"Did I leave anything out of the handover notes?（通用原创）"},{"id":"entry-059","dialogue":"No, you didn't.","collocation":"`you didn't`；感受","meaning":"没有，你没有遗漏。","business":"No, you didn't miss any of the key test cases.（通用原创）"},{"id":"entry-060","dialogue":"The item store hands these out for free.","collocation":"`hand ... out for free`；探索／经历","meaning":"道具商店免费发这些东西。","business":"The training team will hand out the updated user guide for free.（通用原创）"},{"id":"entry-061","dialogue":"It's a guidebook.","collocation":"`It's a ...`；场景","meaning":"这是一本指南。","business":"It's a quick-start guide for new users.（通用原创）"},{"id":"entry-062","dialogue":"You got one, didn't you?","collocation":"`didn't you?`；人物","meaning":"你拿到一本了，对吧？","business":"You received the updated checklist, didn't you?（通用原创）"},{"id":"entry-063","dialogue":"Sure, I got one, so what about it?","collocation":"`so what about it?`；场景","meaning":"对，我拿到了，那又怎样？语气有些顶撞。","business":"Yes, I received it. What would you like me to check?（通用原创）"},{"id":"entry-064","dialogue":"You know who was handing these out?","collocation":"`hand ... out`；探索／经历","meaning":"你知道是谁在发这些吗？","business":"Do you know who handed out the new access cards?（通用原创）"},{"id":"entry-065","dialogue":"The ex beta testers.","collocation":"`the ... testers`；人物","meaning":"那些以前的 Beta 测试者。","business":"The pilot-test users provided the first round of feedback.（通用原创）"},{"id":"entry-066","dialogue":"Listen up, everyone had equal access to this information.","collocation":"`have access to ...`；欲望／作用","meaning":"听着，所有人都能平等获取这些信息。","business":"All project members have access to the shared test results.（通用原创）"},{"id":"entry-067","dialogue":"Even so, lots of players still died.","collocation":"`Even so, ...`；场景","meaning":"即便如此，还是有很多玩家死了。","business":"Even so, we should verify the result before closing the issue.（通用原创）"}]},{"timestamp":"00:06:19.180","entries":[{"id":"entry-068","dialogue":"I didn't come here to point fingers at anyone.","collocation":"`point fingers at ...`；人物","meaning":"我来这里不是为了指责任何人。","business":"I'm not here to point fingers; I want to understand what caused the delay.（通用原创）"},{"id":"entry-069","dialogue":"I'm here because I want to learn from those players' deaths.","collocation":"`learn from ...`；探索／经历","meaning":"我来这里是想从那些玩家的死亡中吸取教训。","business":"We should learn from the last test cycle and update the checklist.（通用原创）"},{"id":"entry-070","dialogue":"I'm here because I want to find out how we're going to beat the boss.","collocation":"`find out how ...`；探索／经历","meaning":"我来这里是想弄清楚我们要怎么打败 Boss。","business":"I'm here to find out how we can complete the migration safely.（通用原创）"}]},{"timestamp":"00:06:39.790","entries":[{"id":"entry-071","dialogue":"Okay.","collocation":"`Okay`；场景","meaning":"好／行。","business":"Okay, I'll update the action list.（通用原创）"},{"id":"entry-072","dialogue":"Can we get back to the meeting now?","collocation":"`get back to ...`；场景","meaning":"我们现在能回到会议正题了吗？","business":"Can we get back to the schedule review?（通用原创）"},{"id":"entry-073","dialogue":"For info on the boss, it's all in here, the latest issue of the guidebook you just heard about.","collocation":"`the latest issue of ...`；时间","meaning":"关于 Boss 的信息都在这本最新一期攻略里。","business":"The latest issue of the test report is in the shared folder.（通用原创）"},{"id":"entry-074","dialogue":"According to the book, the boss's name is Ill Fang, the kobold lord.","collocation":"`According to ...`；探索／经历","meaning":"根据攻略，Boss 叫 Ill Fang，是狗头人领主。","business":"According to the test log, the error first appeared this morning.（通用原创）"},{"id":"entry-075","dialogue":"Also, he'll be surrounded by his minions, the ruined kobold sentinels.","collocation":"`be surrounded by ...`；场景","meaning":"此外，他周围还有部下——毁灭的狗头人哨兵。","business":"The new workflow is surrounded by several approval steps.（通用原创）"},{"id":"entry-076","dialogue":"Ill Fang carries an axe and a buckler.","collocation":"`carry ...`；人物","meaning":"Ill Fang 拿着斧头和小圆盾。","business":"Please carry the updated checklist to the site meeting.（通用原创）"},{"id":"entry-077","dialogue":"He has four health bars.","collocation":"`have ...`；人物","meaning":"他有四条生命值。","business":"The device has four status indicators on the front panel.（通用原创）"},{"id":"entry-078","dialogue":"When the last one turns red, he switches to a curved sword type weapon called a talwar.","collocation":"`switch to ...`；场景","meaning":"最后一条生命值变红时，他会换成一种叫 talwar 的弯刀。","business":"If the first test fails, we'll switch to the backup procedure.（通用原创）"},{"id":"entry-079","dialogue":"He can change his patterns of attack, too.","collocation":"`change ... patterns`；探索／经历","meaning":"他也能改变攻击模式。","business":"The vendor may change the delivery schedule, so let's confirm it today.（通用原创）"},{"id":"entry-080","dialogue":"That's it for the briefing.","collocation":"`That's it for ...`；场景","meaning":"简报就到这里。","business":"That's it for the test update. Are there any questions?（通用原创）"},{"id":"entry-081","dialogue":"As for the distribution of loot, money will be divided equally among everyone.","collocation":"`be divided equally among ...`；人物","meaning":"至于战利品分配，钱会在所有人之间平均分配。","business":"The support hours will be divided equally among the three teams.（通用原创）"},{"id":"entry-082","dialogue":"The party that defeats the boss gets the XP.","collocation":"`the team that ...`；人物","meaning":"击败 Boss 的队伍获得经验值。","business":"The team that completes the validation will present the results.（通用原创）"},{"id":"entry-083","dialogue":"Whoever gets an item gets to keep it.","collocation":"`get to keep ...`；欲望／作用","meaning":"谁拿到物品，谁就可以留下。","business":"The customer gets to keep a copy of the final report.（通用原创）"},{"id":"entry-084","dialogue":"Any objections?","collocation":"`Any objections?`；场景","meaning":"有异议吗？","business":"Any objections to the proposed test window?（通用原创）"},{"id":"entry-085","dialogue":"Good.","collocation":"`Good.`；感受","meaning":"好。","business":"Good, then I'll send the meeting notes.（通用原创）"},{"id":"entry-086","dialogue":"We leave tomorrow at ten in the morning.","collocation":"`at ten in the morning`；时间","meaning":"我们明天早上十点出发。","business":"The installation team will arrive tomorrow at ten in the morning.（通用原创）"},{"id":"entry-087","dialogue":"Meeting adjourned, people.","collocation":"`Meeting adjourned`；场景","meaning":"散会了，各位。正式会议里可用 `The meeting is adjourned`。","business":"The meeting is adjourned; I'll circulate the action items.（通用原创）"}]},{"timestamp":"00:08:18.640","entries":[{"id":"entry-088","dialogue":"Those are pretty good, aren't they?","collocation":"`pretty good`；感受","meaning":"那些味道挺不错的，对吧？","business":"The new test results are pretty good, but we still need to check stability.（通用原创）"},{"id":"entry-089","dialogue":"Mind if I sit down.","collocation":"`Mind if I ...?`；场景","meaning":"我坐下可以吗？原文是问句语气。","business":"Mind if I share my screen to show the issue?（通用原创）"},{"id":"entry-090","dialogue":"You really think these taste good?","collocation":"`think ... taste good`；感受","meaning":"你真觉得这些好吃？","business":"Do you think this explanation is clear to the customer?（通用原创，替换评价对象）"},{"id":"entry-091","dialogue":"Uh huh.","collocation":"`Uh-huh`；感受","meaning":"嗯／对。","business":"Uh-huh, I can see the updated status now.（通用原创）"},{"id":"entry-092","dialogue":"Since I came to this town, I end up eating at least one a day.","collocation":"`at least one a day`；频次","meaning":"自从来到这座城，我每天至少吃一个。","business":"We run at least one system check a day during the rollout.（通用原创）"},{"id":"entry-093","dialogue":"Of course I got a trick to make it taste better.","collocation":"`make ... better`；欲望／作用","meaning":"当然，我有个让它更好吃的小窍门。","business":"We can make the handover process better by using one shared checklist.（通用原创）"},{"id":"entry-094","dialogue":"What trick?","collocation":"`What ...?`；探索／经历","meaning":"什么窍门？","business":"What change caused the test result to improve?（通用原创）"},{"id":"entry-095","dialogue":"Try it with some of that.","collocation":"`try ... with ...`；探索／经历","meaning":"试试把它和那个一起吃。","business":"Try the updated configuration with the backup device first.（通用原创）"},{"id":"entry-096","dialogue":"Cream.","collocation":"本句无适合单独提取的词搭；场景","meaning":"奶油。单词式补充。","business":"Could you add the cream option to the product list?（通用原创）"},{"id":"entry-097","dialogue":"I got it from the heifer Strikes Back, that's the quest in the village before you get to this one.","collocation":"`before you get to ...`；时间","meaning":"我从“Heifer Strikes Back”任务拿到的；那是到这个村之前的村庄任务。任务名和专名按转写保留。","business":"Please complete the safety check before you get to the customer site.（通用原创）"},{"id":"entry-098","dialogue":"You want to know how I did it.","collocation":"`want to know how ...`；欲望／作用","meaning":"你想知道我是怎么做到的吗？","business":"Do you want to know how we isolated the issue?（通用原创）"},{"id":"entry-099","dialogue":"I appreciate the offer, but.","collocation":"`I appreciate the offer, but ...`；感受","meaning":"谢谢你的好意，不过……转写为未完成句。","business":"I appreciate the offer, but we need to confirm the scope first.（通用原创）"},{"id":"entry-100","dialogue":"I didn't come to this town to eat good food.","collocation":"`didn't come ... to ...`；欲望／作用","meaning":"我来这座城不是为了吃好吃的。","business":"I didn't join the call to assign blame; I came to clarify the next steps.（通用原创）"},{"id":"entry-101","dialogue":"Okay, why are you here.","collocation":"`Why are you here?`；探索／经历","meaning":"好吧，那你来这里是为了什么？原转写以句号结尾，按疑问语气理解。","business":"What outcome are you hoping to achieve with this visit?（通用原创）"},{"id":"entry-102","dialogue":"So I don't lose sight of who I am.","collocation":"`lose sight of ...`；欲望／作用","meaning":"为了不忘记自己是谁。","business":"We should not lose sight of the customer's main requirement.（通用原创）"},{"id":"entry-103","dialogue":"I don't want to lock myself in a room in the town of beginnings and slowly rot away.","collocation":"`I don't want to ...`；欲望／作用","meaning":"我不想把自己关在起始之镇的房间里，慢慢消沉下去。剧情表达，不照搬工作场景。","business":"I don't want to leave the unresolved issue out of the handover notes.（通用原创）"},{"id":"entry-104","dialogue":"I'd rather stay the way I am till the last moment.","collocation":"`I'd rather ...`；欲望／作用","meaning":"我宁愿一直保持现在这样，直到最后一刻。","business":"I'd rather verify the data before sending the report.（通用原创）"},{"id":"entry-105","dialogue":"Even if a monster beats me and I die, I won't lose.","collocation":"`Even if ...`；场景","meaning":"即使被怪物打败、死去，我也不会输。","business":"Even if the first test fails, we'll document the result and try the backup plan.（通用原创）"}]},{"timestamp":"00:09:59.570","entries":[{"id":"entry-106","dialogue":"To this game or this world.","collocation":"转写残句；`to ...`；场景","meaning":"接上句“我不会输给这场游戏或这个世界”；原文件另起时间戳。","business":"The change applies to this system and the connected test environment.（通用原创）"},{"id":"entry-107","dialogue":"No matter what, I wouldn't want a party member dying on me, so try not to die tomorrow.","collocation":"`No matter what`；场景","meaning":"无论如何，我不想队友在我面前死去，所以明天尽量别死。戏剧情境，不要照搬字面。","business":"No matter what happens during testing, please report the issue as soon as possible.（通用原创）"},{"id":"entry-108","dialogue":"Let's go over it again.","collocation":"`go over ... again`；探索／经历","meaning":"我们再过一遍。","business":"Let's go over the acceptance checklist again before sign-off.（通用原创）"}]},{"timestamp":"00:10:22.280","entries":[{"id":"entry-109","dialogue":"We're the backup, so our target's going to be the boss's minions, the ruined cobalt sentinels.","collocation":"`our target is ...`；欲望／作用","meaning":"我们是后援，所以目标是 Boss 的手下——原转写写作 `cobalt`，可能是识别错误。","business":"Our target for this phase is the data-migration test.（通用原创）"},{"id":"entry-110","dialogue":"I know I'll use a sword skill to knock their weapons up and out of the way.","collocation":"`out of the way`；场景","meaning":"我会用剑技把他们的武器打飞、移开。","business":"Move the unused equipment out of the way before the installation starts.（通用原创）"}]},{"timestamp":"00:10:33.800","entries":[{"id":"entry-111","dialogue":"When I do switch and jump in.","collocation":"`jump in`；探索／经历","meaning":"等我切换后加入战斗。转写像是未完成句，保留原样。","business":"I'll jump in if the customer needs help with the setup.（通用原创）"},{"id":"entry-112","dialogue":"What's a switch?","collocation":"`What's a ...?`；探索／经历","meaning":"什么是 switch？","business":"What's a successful result for this test?（通用原创）"},{"id":"entry-113","dialogue":"Okay, level with me, is this the first time you've ever been in a party?","collocation":"`the first time ...`；时间","meaning":"好，跟我说实话，这是你第一次组队吗？`level with me` 是“跟我说实话”。","business":"Is this the first time you've used this installation tool?（通用原创）"},{"id":"entry-114","dialogue":"Uhu.","collocation":"转写原样；无可靠词搭","meaning":"原文件如此转写，可能是肯定回应的声音。","business":"Yes, this is my first time supporting this system.（通用原创）"},{"id":"entry-115","dialogue":"Listen up everyone, I've only got one thing to say to you.","collocation":"`I've only got one thing to say`；场景","meaning":"大家听着，我只说一件事。","business":"I've only got one thing to add before we close the review.（通用原创）"},{"id":"entry-116","dialogue":"Let's win.","collocation":"`Let's ...`；欲望／作用","meaning":"我们赢下这场战斗吧。","business":"Let's finish the validation on time.（通用原创）"},{"id":"entry-117","dialogue":"Come on.","collocation":"`Come on`；场景","meaning":"来吧／加油。","business":"Come on, let's check the final test case together.（通用原创）"},{"id":"entry-118","dialogue":"Comm attack.","collocation":"转写疑似有误；本句无可靠词搭","meaning":"原文件转写为 `Comm attack`，不确定原声内容，不猜改。","business":"Please confirm the command before running the test.（通用原创）"}]},{"timestamp":"00:11:49.460","entries":[{"id":"entry-119","dialogue":"Squads a and c switching, here it comes.","collocation":"`here it comes`；场景","meaning":"A、C 小队切换，攻击要来了。","business":"The data is ready; here it comes in the shared folder.（通用原创）"},{"id":"entry-120","dialogue":"Squad b block.","collocation":"`block`；探索／经历","meaning":"B 小队格挡。","business":"Block the release until the test owner confirms the result.（通用原创）"},{"id":"entry-121","dialogue":"Squad c keep guarding and prepare to switch.","collocation":"`prepare to ...`；欲望／作用","meaning":"C 小队继续防守并准备切换。","business":"Please prepare to switch to the backup server if needed.（通用原创）"},{"id":"entry-122","dialogue":"Everyone else, when you fall back, regroup and flank them.","collocation":"`regroup`；探索／经历","meaning":"其他人后撤时重新集合并从侧面包抄。","business":"If the first attempt fails, let's regroup and review the logs.（通用原创）"},{"id":"entry-123","dialogue":"Squads d, e and f keep those minions off us.","collocation":"`keep ... off ...`；欲望／作用","meaning":"D、E、F 小队挡住那些小怪，别让它们靠近我们。","business":"Keep the unrelated changes off the production system.（通用原创）"},{"id":"entry-124","dialogue":"Yeah, you got it.","collocation":"`You got it.`；场景","meaning":"好，明白。","business":"You got it. I'll send the updated checklist today.（通用原创）"},{"id":"entry-125","dialogue":"I thought she was a beginner, but she's got good skills.","collocation":"`I thought ... but ...`；感受","meaning":"我原以为她是新手，不过她技能很好。","business":"I thought the setup was complete, but one access step is still missing.（通用原创）"},{"id":"entry-126","dialogue":"I can't even see the tip of her sword.","collocation":"`can't even see ...`；感受","meaning":"我甚至看不见她的剑尖。","business":"I can't even see the latest version in the shared folder.（通用原创）"},{"id":"entry-127","dialogue":"Right on, looks like the guidebook was right.","collocation":"`looks like ... was right`；感受","meaning":"没错，看起来攻略说得对。","business":"Looks like the test report was right about the network delay.（通用原创）"},{"id":"entry-128","dialogue":"Stand back, I got it.","collocation":"`Stand back`；场景","meaning":"退后，我来处理。语气较命令式。","business":"Please stand back while I check the equipment connection.（通用原创）"},{"id":"entry-129","dialogue":"I thought the plan was for everyone in the group to surround it.","collocation":"`the plan was for ...`；欲望／作用","meaning":"我以为计划是让所有人包围它。","business":"The plan is for both teams to review the interface together.（通用原创）"}]},{"timestamp":"00:12:58.840","entries":[{"id":"entry-130","dialogue":"That's not a tow war, it's a nodachi.","collocation":"转写疑似有误；`That's not ..., it's ...`；场景","meaning":"转写为 `tow war` 和 `nodachi`；武器名称疑似听写错误，保留原样。","business":"That's not the final report; it's the draft version.（通用原创）"},{"id":"entry-131","dialogue":"This isn't like the beta.","collocation":"`isn't like ...`；场景","meaning":"这和 Beta 测试时不一样。","business":"The production environment isn't like the test environment.（通用原创）"},{"id":"entry-132","dialogue":"Wait, stop, it's no good, get out of there.","collocation":"`get out of ...`；场景","meaning":"等等，停下，不行，快离开那里。","business":"It's no good to continue the test; please get out of the restricted area.（通用原创）"},{"id":"entry-133","dialogue":"What the hell were you thinking?","collocation":"`What were you thinking?`；感受","meaning":"你当时到底在想什么？语气冒犯，别用于职场。","business":"Could you explain what you were considering when you made that change?（通用原创）"},{"id":"entry-134","dialogue":"You know you were a beta tester too, weren't you?","collocation":"`weren't you?`；人物","meaning":"你也曾是 Beta 测试者，对吧？原文反意疑问句重复，按字幕原样保留。","business":"You were part of the pilot test too, weren't you?（通用原创）"},{"id":"entry-135","dialogue":"You were after the last attack bonus, the rare item.","collocation":"`be after ...`；欲望／作用","meaning":"你当时是冲着最后一击奖励、稀有物品去的。","business":"We are after a clear answer on who owns the remaining issue.（通用原创）"},{"id":"entry-136","dialogue":"You're just like me, a beta tester.","collocation":"`just like ...`；人物","meaning":"你和我一样，都是 Beta 测试者。","business":"This configuration is just like the one we tested last week.（通用原创）"},{"id":"entry-137","dialogue":"Please, you have to defeat the boss for everyone here.","collocation":"`for everyone here`；人物","meaning":"拜托，为了这里所有人，你必须打败 Boss。","business":"Please share the updated instructions with everyone here.（通用原创）"}]},{"timestamp":"00:14:14.200","entries":[{"id":"entry-138","dialogue":"When this death game started, the only thing I thought about was how I was going to survive.","collocation":"`the only thing I thought about`；探索／经历","meaning":"这场死亡游戏开始时，我唯一想的就是怎么活下去。","business":"The only thing I thought about during the outage was how to restore the service safely.（通用原创）"},{"id":"entry-139","dialogue":"Nothing else mattered.","collocation":"`Nothing else mattered.`；感受","meaning":"其他一切都不重要。","business":"During the final check, data accuracy mattered more than presentation.（通用原创）"}]},{"timestamp":"00:14:24.140","entries":[{"id":"entry-140","dialogue":"Take care.","collocation":"`Take care.`；人物","meaning":"保重。","business":"Take care, and please contact me if the issue returns.（通用原创）"},{"id":"entry-141","dialogue":"I'll be seeing you, Klein, but you weren't like that, diabel.","collocation":"`I'll be seeing you`；人物","meaning":"再见了，Klein；但你和那种人不一样，Diabel。人名大小写及断句按转写整理。","business":"I'll be seeing you at tomorrow's project review.（通用原创）"},{"id":"entry-142","dialogue":"You never abandoned the other players.","collocation":"`never abandon ...`；人物","meaning":"你从没抛下其他玩家。","business":"We shouldn't abandon the users who still need migration support.（通用原创）"},{"id":"entry-143","dialogue":"You brought them together, you led everyone, and you fought brilliantly.","collocation":"`bring ... together`；人物","meaning":"你把大家团结起来，带领所有人，并英勇战斗。","business":"The project lead brought the support teams together to resolve the issue.（通用原创）"},{"id":"entry-144","dialogue":"You tried to accomplish something I couldn't.","collocation":"`try to accomplish ...`；欲望／作用","meaning":"你努力完成了我做不到的事。","business":"We are trying to accomplish the site acceptance before the end of the month.（通用原创）"},{"id":"entry-145","dialogue":"I'll go too.","collocation":"`I'll ... too`；人物","meaning":"我也去。","business":"I'll join the customer call too.（通用原创）"},{"id":"entry-146","dialogue":"Okay, we'll hit him just like we did the minions.","collocation":"`just like we did ...`；探索／经历","meaning":"好，我们像对付小怪那样攻击他。","business":"We'll test the new module just like we tested the previous one.（通用原创）"},{"id":"entry-147","dialogue":"You got it.","collocation":"`You got it.`；场景","meaning":"明白／交给我吧。","business":"You got it. I'll confirm the access rights this afternoon.（通用原创）"}]},{"timestamp":"00:15:24.620","entries":[{"id":"entry-148","dialogue":"He's coming back.","collocation":"`come back`；探索／经历","meaning":"他回来了／正在回来。","business":"The system came back online after the restart.（通用原创）"},{"id":"entry-149","dialogue":"We can hold this bastard off until your health back up.","collocation":"`hold ... off until ...`；时间","meaning":"我们能拖住这家伙，直到你的生命值恢复。原文似缺少 `is`，按转写保留。","business":"We can hold the release until the customer confirms the test result.（通用原创）"},{"id":"entry-150","dialogue":"You got it.","collocation":"`You got it.`；场景","meaning":"明白／交给我。","business":"You got it. I'll prepare the test environment.（通用原创）"},{"id":"entry-151","dialogue":"Watch out, you're going down.","collocation":"`Watch out`；场景","meaning":"小心，你要倒下了。","business":"Watch out—the cable is loose near the equipment.（通用原创）"},{"id":"entry-152","dialogue":"Come on, asana, help me beat this sucker.","collocation":"`help me ...`；人物","meaning":"来吧，Asana，帮我打败这家伙。名字和粗俗词按转写保留。","business":"Could you help me check this configuration before we deploy it?（通用原创）"},{"id":"entry-153","dialogue":"One last attack, you got it.","collocation":"`one last ...`；时间","meaning":"最后一次攻击，你能行。","business":"Let's run one last check before the handover.（通用原创）"}]},{"timestamp":"00:17:11.860","entries":[{"id":"entry-154","dialogue":"Baby?","collocation":"转写疑似有误；本句无可靠词搭","meaning":"文件转写成 `Baby?`，可能是别的短语，保留原样。","business":"Could you confirm the test result?（通用原创）"},{"id":"entry-155","dialogue":"Yes, come on.","collocation":"`Come on.`；场景","meaning":"是的，来吧。","business":"Yes, come on—let's review the last open item.（通用原创）"},{"id":"entry-156","dialogue":"Nice job, that was some fine swordsmanship.","collocation":"`Nice job`；感受","meaning":"干得漂亮，剑术很不错。","business":"Nice job. You explained the issue clearly to the customer.（通用原创）"},{"id":"entry-157","dialogue":"Congratulations, today's victory is all thanks to you.","collocation":"`all thanks to ...`；人物","meaning":"恭喜，今天的胜利全都归功于你。","business":"The smooth handover was all thanks to everyone's preparation.（通用原创）"},{"id":"entry-158","dialogue":"No, stop cheering.","collocation":"`stop ...`；场景","meaning":"不，别欢呼了。","business":"Please stop the test while we check the safety alert.（通用原创）"},{"id":"entry-159","dialogue":"Why'd you do it, huh?","collocation":"`Why did you ...?`；探索／经历","meaning":"你为什么这么做？","business":"Why did you change the access settings?（通用原创）"},{"id":"entry-160","dialogue":"Why'd you let diabbel die?","collocation":"`let someone ...`；人物","meaning":"你为什么让 Diabel 死了？名字按转写保留。","business":"Why did we let the issue remain unresolved before the release?（通用原创）"},{"id":"entry-161","dialogue":"Let him die, that's what I said.","collocation":"`that's what I said`；感受","meaning":"“让他死”，我就是这么说的。原句语气极端，工作中不要照搬。","business":"That's what I said in the review: we need to verify the root cause first.（通用原创）"},{"id":"entry-162","dialogue":"Admit it, you knew the technique the boss was going to use.","collocation":"`Admit it`；场景","meaning":"承认吧，你知道 Boss 要用什么招式。语气像逼问。","business":"Please confirm whether you knew about the change before the test.（通用原创）"},{"id":"entry-163","dialogue":"You could have told us, then diabba would have stood a chance.","collocation":"`could have told ...`；欲望／作用","meaning":"你本可以告诉我们，那样 Diabel 就有机会了。转写人名疑似有误。","business":"You could have told us about the dependency earlier, so we could have adjusted the schedule.（通用原创）"},{"id":"entry-164","dialogue":"He wouldn't have had to die.","collocation":"`wouldn't have had to ...`；欲望／作用","meaning":"他本来不必死。","business":"We wouldn't have had to repeat the test if the configuration had been recorded.（通用原创）"},{"id":"entry-165","dialogue":"I know why.","collocation":"`I know why`；探索／经历","meaning":"我知道原因。","business":"I know why the test failed: the account did not have access.（通用原创）"},{"id":"entry-166","dialogue":"He knew he used to be a beta tester.","collocation":"`used to be ...`；时间","meaning":"他知道自己以前是 Beta 测试者。原转写语义略不清，照录。","business":"I used to be responsible for user training on the previous system.（通用原创）"},{"id":"entry-167","dialogue":"Think about it.","collocation":"`Think about ...`；探索／经历","meaning":"想想看。","business":"Think about the impact on users before we change the workflow.（通用原创）"},{"id":"entry-168","dialogue":"He knew the boss's attack patterns.","collocation":"`know ... patterns`；探索／经历","meaning":"他知道 Boss 的攻击模式。","business":"We know the error pattern from the last three test runs.（通用原创）"},{"id":"entry-169","dialogue":"He knew, but he kept it from us.","collocation":"`keep ... from ...`；人物","meaning":"他知道，但他瞒着我们。","business":"Please don't keep a blocking issue from the project team.（通用原创）"},{"id":"entry-170","dialogue":"And I bet he's not the only beta tester here.","collocation":"`not the only ...`；人物","meaning":"我敢说这里不止他一个 Beta 测试者。","business":"This is not the only system affected by the update.（通用原创）"},{"id":"entry-171","dialogue":"Come on, show yourselves.","collocation":"`show yourself`；场景","meaning":"来吧，现身吧。","business":"Please identify yourself before joining the secure test session.（通用原创）"},{"id":"entry-172","dialogue":"This is bad at this rate for everyone here.","collocation":"`at this rate`；场景","meaning":"照这样下去，这里所有人都会有麻烦。","business":"At this rate, we may miss the planned go-live date.（通用原创）"}]},{"timestamp":"00:19:03.120","entries":[{"id":"entry-173","dialogue":"Hey, calm down, so you guys think I used to be a beta tester.","collocation":"`calm down`；场景","meaning":"嘿，冷静点，所以你们觉得我以前是 Beta 测试者。","business":"Let's calm down and review the facts before we assign responsibility.（通用原创）"},{"id":"entry-174","dialogue":"It's not cool to put me in the same class with those noobs.","collocation":"`put ... in the same class as ...`；人物","meaning":"把我和那些菜鸟归为一类可不酷。原句口语且带贬义。","business":"We shouldn't put these two issues in the same category until we compare the logs.（通用原创）"},{"id":"entry-175","dialogue":"What'd you say?","collocation":"`What did you say?`；场景","meaning":"你说什么？缩略口语。","business":"Sorry, what did you say about the delivery window?（通用原创）"},{"id":"entry-176","dialogue":"You heard me.","collocation":"`You heard me.`；场景","meaning":"你听到了。","business":"You heard me correctly: the test starts at nine.（通用原创）"},{"id":"entry-177","dialogue":"Most of the thousand people who scored a slot in SAO's beta were rookies.","collocation":"`most of ...`；人物","meaning":"SAO Beta 测试名额里，大多数人都是新手。专名按转写保留。","business":"Most of the users who joined the pilot were new to the system.（通用原创）"},{"id":"entry-178","dialogue":"They were so green they didn't even know how to level up.","collocation":"`didn't even know how to ...`；探索／经历","meaning":"他们太新手了，甚至不知道如何升级。`green` 此处指缺乏经验。","business":"The new operators didn't even know how to reset the test device.（通用原创）"},{"id":"entry-179","dialogue":"Hell, even you guys are better than they were.","collocation":"`better than ...`；感受","meaning":"说真的，连你们都比他们强。","business":"The new test results are better than the previous ones.（通用原创）"},{"id":"entry-180","dialogue":"But me?","collocation":"`But me?`；人物","meaning":"但我呢？强调自己。","business":"But my team? We can provide the on-site support.（通用原创）"},{"id":"entry-181","dialogue":"I'm nothing like those guys, man.","collocation":"`nothing like ...`；人物","meaning":"伙计，我和那些人完全不一样。","business":"This test environment is nothing like the live system.（通用原创）"},{"id":"entry-182","dialogue":"During the beta I made it to floors that were higher than any of the other testers.","collocation":"`make it to ...`；探索／经历","meaning":"Beta 期间，我到达了比其他测试者更高的楼层。","business":"We made it to the final validation stage ahead of schedule.（通用原创）"},{"id":"entry-183","dialogue":"That's a fact.","collocation":"`That's a fact.`；感受","meaning":"这是事实。","business":"That's a fact we confirmed in the test log.（通用原创）"},{"id":"entry-184","dialogue":"I knew about the boss because I fought tons of monsters with way more sword skills on higher floors.","collocation":"`know about ...`；探索／经历","meaning":"我了解 Boss，是因为我在更高楼层和许多更强的怪物战斗过。","business":"We knew about the compatibility issue because we tested the system on older devices.（通用原创）"},{"id":"entry-185","dialogue":"I know a bunch of other things too.","collocation":"`a bunch of ...`；探索／经历","meaning":"我还知道很多其他事情。较随意的数量说法。","business":"I have a bunch of test records to share with the team.（通用原创）"},{"id":"entry-186","dialogue":"More than you can imagine.","collocation":"`more than you can imagine`；程度","meaning":"多得超出你的想象。","business":"The migration involves more data than we first expected.（通用原创）"},{"id":"entry-187","dialogue":"More than any info broker.","collocation":"`more than ...`；人物","meaning":"比任何情报商知道得都多。原句是省略句。","business":"The project team has more test data than any external vendor.（通用原创）"},{"id":"entry-188","dialogue":"What the hell?","collocation":"`What the ...?`；感受","meaning":"搞什么？语气粗鲁。","business":"What happened to the test environment?（通用原创，改为职场可用说法）"},{"id":"entry-189","dialogue":"If that's true, then you're worse than a beta tester.","collocation":"`If that's true, ...`；场景","meaning":"如果那是真的，那你比 Beta 测试者更糟。","business":"If that's true, then we need to review the access records.（通用原创）"},{"id":"entry-190","dialogue":"You're a goddamn cheater, that's what you are.","collocation":"`that's what you are`；感受","meaning":"你就是个该死的作弊者。强烈粗俗表达，不用于职场。","business":"That would be a serious process violation.（通用原创，替换为中性表达）"},{"id":"entry-191","dialogue":"He's a beta tester and a cheater.","collocation":"`A and B`；人物","meaning":"他既是 Beta 测试者，也是作弊者。","business":"The device is both outdated and incompatible with the new software.（通用原创）"},{"id":"entry-192","dialogue":"He's a.","collocation":"转写残句；无可靠词搭","meaning":"原转写未完成，无法确定后续内容。","business":"—"}]},{"timestamp":"00:20:21.300","entries":[{"id":"entry-193","dialogue":"A beater?","collocation":"转写／剧情造词；`A ...?`；探索／经历","meaning":"“封弊者？”剧情把 Beta Tester 和 Cheater 混成新词 `beater`。","business":"A pilot tester? Could you explain what that role involves?（通用原创）"},{"id":"entry-194","dialogue":"Yeah, that's good.","collocation":"`That's good.`；感受","meaning":"嗯，这个称呼不错。","business":"That's good. The revised schedule works for our team.（通用原创）"},{"id":"entry-195","dialogue":"I like it, okay, you can call me a beater.","collocation":"`you can call me ...`；人物","meaning":"我喜欢这个称呼，好吧，你们可以叫我 beater。","business":"You can call me Alex; I'll be your contact during the installation.（通用原创）"},{"id":"entry-196","dialogue":"Just make sure you don't confuse me with those beta testers anymore.","collocation":"`make sure ...`；欲望／作用","meaning":"只要确保以后别再把我和那些 Beta 测试者搞混。","business":"Please make sure you don't confuse the test and production accounts.（通用原创）"}]},{"timestamp":"00:20:39.280","entries":[{"id":"entry-197","dialogue":"Wait.","collocation":"`Wait.`；时间","meaning":"等一下。","business":"Wait, I need to confirm the file version.（通用原创）"},{"id":"entry-198","dialogue":"When we were fighting the boss, you called me by my name.","collocation":"`call someone by their name`；人物","meaning":"我们打 Boss 时，你叫出了我的名字。","business":"Please call the customer by their preferred name during the meeting.（通用原创）"},{"id":"entry-199","dialogue":"I wasn't trying to be rude.","collocation":"`try to be ...`；感受","meaning":"我不是故意无礼的。","business":"I wasn't trying to delay the project; I needed to verify the change.（通用原创）"},{"id":"entry-200","dialogue":"Did I mess up the pronunciation?","collocation":"`mess up ...`；探索／经历","meaning":"我是不是把发音念错了？","business":"Did I mess up the product code when I entered it?（通用原创）"},{"id":"entry-201","dialogue":"How'd you even know it?","collocation":"`How did you ...?`；探索／经历","meaning":"你到底是怎么知道的？","business":"How did you identify the cause of the error?（通用原创）"},{"id":"entry-202","dialogue":"If you look right about here, you'll see another HP gauge under yours.","collocation":"`If you look ...`；场景","meaning":"如果你看这里，就会看到你下面还有一条 HP 槽。","business":"If you look at the lower-right corner, you'll see the system status.（通用原创）"},{"id":"entry-203","dialogue":"There's a name written right next to it.","collocation":"`right next to ...`；地点","meaning":"它旁边写着一个名字。","business":"The revision number is written right next to the file name.（通用原创）"},{"id":"entry-204","dialogue":"Yeah, kirio kirito.","collocation":"转写疑似有误；人物","meaning":"原转写为 `kirio kirito`，疑似人名识别错误，保留原样。","business":"The contact name is written as “K. Tanaka” on the form.（通用原创）"},{"id":"entry-205","dialogue":"Your name is kitrio.","collocation":"转写疑似有误；人物","meaning":"原转写为 `kitrio`，疑似名字听写错误。","business":"Your user ID is listed on the first page of the handover sheet.（通用原创）"},{"id":"entry-206","dialogue":"Yeah.","collocation":"`Yeah.`；场景","meaning":"嗯。","business":"Yeah, I can access the test environment now.（通用原创）"},{"id":"entry-207","dialogue":"I'm so dumb.","collocation":"`I'm so ...`；感受","meaning":"我真笨。自我贬低，不必照搬。","business":"I missed that detail. I'll correct it now.（通用原创，职场更合适）"},{"id":"entry-208","dialogue":"It was there the whole time and I never knew.","collocation":"`the whole time`；时间","meaning":"它一直都在那里，我却始终不知道。","business":"The warning was on the screen the whole time, but we didn't notice it.（通用原创）"},{"id":"entry-209","dialogue":"You can become powerful here on your own, but if the day comes when someone you trust invites you to join a guild, don't turn it down because there are limits to what a solo player can do, but you're solo.","collocation":"`there are limits to what ... can do`；欲望／作用","meaning":"你可以独自变强，但若有一天信任的人邀请你加入公会，别拒绝，因为独行玩家能力有限——转写末尾 `but you're solo` 语义突兀，按原样保留。","business":"There are limits to what one engineer can verify alone, so let's ask the site team to review the result.（通用原创）"}]},{"timestamp":"00:23:36.040","entries":[{"id":"entry-210","dialogue":"Next time, red nosed reindeer.","collocation":"`Next time, ...`；时间","meaning":"下集：《红鼻子驯鹿》。","business":"Next time, we'll review the remaining acceptance items.（通用原创）"}]}],"expansions":["**`be on the same page`（场景）**：`Are we on the same page about the deadline?`（我们对截止时间理解一致吗？）；`I want to make sure we're on the same page before we start.`（开始前我想确认大家理解一致。）","**`find out how/where ...`（探索／经历）**：`Let's find out how the error happened.`（查清错误是怎么发生的。）；`We need to find out where the file was saved.`（我们得查明文件保存在哪里。）","**`make it to ...`（欲望／作用）**：`We made it to the final test.`（我们进入最终测试了。）；`Can we make it to the site by nine?`（我们能九点前到现场吗？）","**`go over ... again`（探索／经历）**：`Let's go over the steps again.`（我们再过一遍步骤。）；`Could you go over the handover notes with me?`（你能和我一起核对交接记录吗？）","**`make sure ...`（欲望／作用）**：`Make sure the backup is ready.`（确认备份已准备好。）；`I'll make sure the customer receives the update.`（我会确保客户收到更新。）"],"appendix":"## 值得顺手扩展的词搭\n\n- **`be on the same page`（场景）**：`Are we on the same page about the deadline?`（我们对截止时间理解一致吗？）；`I want to make sure we're on the same page before we start.`（开始前我想确认大家理解一致。）\n- **`find out how/where ...`（探索／经历）**：`Let's find out how the error happened.`（查清错误是怎么发生的。）；`We need to find out where the file was saved.`（我们得查明文件保存在哪里。）\n- **`make it to ...`（欲望／作用）**：`We made it to the final test.`（我们进入最终测试了。）；`Can we make it to the site by nine?`（我们能九点前到现场吗？）\n- **`go over ... again`（探索／经历）**：`Let's go over the steps again.`（我们再过一遍步骤。）；`Could you go over the handover notes with me?`（你能和我一起核对交接记录吗？）\n- **`make sure ...`（欲望／作用）**：`Make sure the backup is ready.`（确认备份已准备好。）；`I'll make sure the customer receives the update.`（我会确保客户收到更新。）\n\n## BEC 补充：电话里拼读字母\n\n本轮随机选中的 BEC 第 47 课资料第 1 页列有 NATO Phonetic Alphabet（如 A = Alpha、B = Bravo、C = Charlie）。电话里报工单号、姓名或设备编号时，可以说：\n\n\u003e `Could you spell the code using the NATO phonetic alphabet?`\n\n这是根据 BEC 第 1 页字母表整理的原创口语用法，不是动漫台词。例：`The code is B-7-C: Bravo, Seven, Charlie.`\n\n## 简单开口练习\n\n1. 先听英配、看字幕，跟读这 8 句：`Okay people, now that everyone's here let's get this meeting started.`；`Now let's figure out how we're gonna beat the boss.`；`I want to make sure I'm on the same page.`；`Can we get back to the meeting now?`；`Let's go over it again.`；`That's it for the briefing.`；`You got it.`；`Just make sure you don't confuse me with those beta testers anymore.` 跟读后合上字幕复述意思。\n2. 选 3 个搭配各造一句自己的话：`find out how ...`、`at least ... a day`、`make sure ...`。\n3. 简单回答两个商务口语问题：`What is going on with the project?`；`How can we make sure the customer understands the next step?` 可以用本表的搭配，不必写长答案。\n\n把你的口语回答文字或转写发来，我会只指出最重要的 1–3 个搭配、语法或自然度问题，并给你短句修正版；只有能访问录音时才评价发音。\n\n## 今天的最小完成版\n\n跟读 5 句动漫原文，记住 3 个搭配，再用其中 1 个说一个自己的句子。有精力时，再用 NATO 字母表拼读一个虚构工单编号。","source":"# 刀剑神域第 2 集 × BEC 口语词搭训练\n\n## 本轮材料\n\n- **动漫 TXT：** `2-2.ビーター   封弊者-1080P 高清-AVC.txt`，按文件现有时间戳顺序处理。原文件是时间戳分段的转写，含 ASR 错字、残句和中文混入；下文保留可辨认的英文原样，问题处标“转写疑似有误”，不擅自修成另一个原句。纯中文片段略过。\n- **随机抽取的 BEC 资料：** `[BEC中级Lesson47]phonetic alphabet.pdf`，第 1 页。内容是 NATO 和 Western Union 拼读字母表。这份资料与动漫主线没有直接词搭重合，因此只在电话确认姓名、编号时作补充迁移；表格里其余商务例句均标“通用原创”，不冒称来自 BEC。\n- **钱多多标签：** 每句选一个主要思维类目。标签只作记忆提示，不是评分。\n\n## 动漫原句逐句词搭\n\n### 00:00:11.960\n\n| 动漫台词原文 | 核心词搭＋分类 | 中文理解 | 一个商务例句 |\n|---|---|---|---|\n| Since the game began, a whole month has gone by and two thousand people have died so far. | `since ... began`；时间 | 游戏开始以来，已经过去整整一个月，到目前为止已有两千人死亡。 | Since the project began, we have completed the first testing phase.（通用原创） |\n| After all this time, none of the players have been able to clear floor one. | `have been able to`；欲望／作用 | 这么久以来，没有玩家能通过第一层。 | We haven't been able to reproduce the issue yet.（通用原创） |\n| I used to be a beta tester and even I haven't found out where the boss is, hilarious. | `find out where ... is`；探索／经历 | 我以前是测试玩家，连我都没找到 Boss 在哪儿——原转写末尾 `hilarious` 可能是断句或识别问题。 | We need to find out where the data mismatch starts.（通用原创） |\n| And today finally we're having a meeting to figure out how to find and defeat the floor one boss. | `have a meeting to figure out`；场景 | 今天终于要开会，想办法找到并击败第一层 Boss。 | We're having a meeting to figure out how to resolve the launch issue.（通用原创） |\n\n### 00:00:59.940\n\n| 动漫台词原文 | 核心词搭＋分类 | 中文理解 | 一个商务例句 |\n|---|---|---|---|\n| 气氛，所以。I give you everything I. | `give you ...`；欲望／作用 | 前半句是中文混入；英文是转写残句，原样保留，意思不完整。 | I can give you a quick update after the test.（通用原创） |\n| Okay people, now that everyone's here let's get this meeting started. | `get this meeting started`；场景 | 好了，大家都到了，我们开始开会。 | Now that everyone's here, let's get the project review started.（通用原创） |\n| So anyway, I want to thank everyone for coming. | `thank everyone for coming`；人物 | 总之，感谢大家到场。 | I'd like to thank everyone for joining today's customer call.（通用原创） |\n| Good to see you. | `good to see you`；人物 | 很高兴见到你。 | Good to see you again. Could we review the open items?（通用原创） |\n| My name is diabel and in this game the job I rolled is knight. | `My name is ...`；人物 | 我叫 Diabel；在这个游戏里，我抽到的职业是骑士。人名和 `job I rolled` 按转写保留。 | My name is Alex, and I'll coordinate the implementation schedule.（通用原创） |\n| Dude there's no job system in this game. | `there's no ... system`；场景 | 伙计，这游戏没有职业系统。 | There's no separate approval system for this test environment.（通用原创） |\n| You guys want to hear this or not. | `want to hear ... or not`；欲望／作用 | 你们到底想不想听？语气较冲，不建议照搬到职场。 | Would you like me to walk you through the test results?（通用原创） |\n\n### 00:02:39.840\n\n| 动漫台词原文 | 核心词搭＋分类 | 中文理解 | 一个商务例句 |\n|---|---|---|---|\n| Right anyway, here's the deal. | `here's the deal`；场景 | 好了，重点是这样。口语、直接。 | Here's the current status: the test is complete, but one issue remains.（通用原创） |\n| Our party found the boss room at the top of the tower today. | `at the top of ...`；地点 | 我们队今天在塔顶找到了 Boss 房间。 | The latest test results are at the top of the report.（通用原创） |\n| First we need to defeat the boss and make it to floor two. | `make it to ...`；欲望／作用 | 首先要击败 Boss，进入第二层。 | We need to finish the user test and make it to the next project phase.（通用原创） |\n| The next step is we have to tell everyone waiting in the town of beginnings that it is possible to beat this game. | `the next step is ...`；探索／经历 | 下一步是告诉起始之镇等待的人，游戏是可以通关的。 | The next step is to confirm the test scope with the customer.（通用原创） |\n| Fact is, it's our duty as the most capable players here. | `it's our duty to ...`；欲望／作用 | 事实上，作为这里能力最强的玩家，这是我们的责任。 | It's our duty to keep the customer informed about major risks.（通用原创） |\n| Do you agree or not? | `Do you agree ...?`；感受 | 你同不同意？ | Do you agr function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]))}
function inlineMd(value){return esc(value).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>")}
function markdownBlock(markdown){const out=[];let list="";const close=()=>{if(list){out.push(`</${list}>`);list=""}};for(const line of String(markdown||"").split(/\r?\n/)){if(!line.trim()){close();continue}const h=line.match(/^(#{1,4})\s+(.+)$/);if(h){close();out.push(`<h2>${inlineMd(h[2])}</h2>`);continue}const b=line.match(/^\s*-\s+(.+)$/);if(b){if(list!=="ul"){close();out.push("<ul>");list="ul"}out.push(`<li>${inlineMd(b[1])}</li>`);continue}const n=line.match(/^\s*\d+\.\s+(.+)$/);if(n){if(list!=="ol"){close();out.push("<ol>");list="ol"}out.push(`<li>${inlineMd(n[1])}</li>`);continue}const q=line.match(/^>\s?(.*)$/);if(q){close();out.push(`<blockquote>${inlineMd(q[1])}</blockquote>`);continue}close();out.push(`<p>${inlineMd(line)}</p>`)}close();return out.join("")}
function categoryOf(cell){const tags=["场景","人物","探索／经历","欲望／作用","感受","时间","地点","程度","频次","本句无可靠词搭","无可靠词搭"];return tags.find(tag=>String(cell).includes(`；${tag}`))||""}
function phraseOf(cell){return String(cell).split("；")[0].replace(/`/g,"").replace(/^转写疑似有误；?\s*/,"").trim()}
function stripMd(value){return String(value||"").replace(/`|\*\*/g,"").replace(/\*/g,"").trim()}
function norm(value){return stripMd(value).toLocaleLowerCase().replace(/[\s\p{P}\p{S}]+/gu,"")}
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}

function updateNav(){document.querySelectorAll(".nav [data-view]").forEach(button=>button.classList.toggle("active",button.dataset.view===view));const count=document.getElementById("review-count");if(count)count.textContent=state.reviewIds.length}
function render(){updateNav();const app=document.getElementById("app");if(session){app.innerHTML=session.done?renderResults():renderQuestion();return}if(view==="home")app.innerHTML=renderHome();else if(view==="map")app.innerHTML=renderMap();else if(view==="library")app.innerHTML=renderLibrary();else app.innerHTML=renderReviewHome();bindViewActions()}
function renderHome(){const seen=Object.values(state.rowStats).filter(s=>s.seen>0).length;return `<section class="hero pixel-card"><div class="hero-copy"><div class="eyebrow">第 1 集 · 第 2 话 / BEC 词搭副本</div><h1>今天也来<br>清一层吧。</h1><p>把 23 个时间点、210 条台词变成一场短短的探索。认词搭、看语境、把动漫台词迁移到商务英语；不计时，错了就收进回顾清单。</p><div class="hero-actions"><button class="button primary" data-action="quick">▶ 开始 10 题速刷</button><button class="button secondary" data-action="map">⌖ 选择楼层</button></div></div><div class="dungeon-scene" aria-label="像素浮空城插画"><div class="tower"></div><div class="scene-label">FLOATING CASTLE</div></div></section>
<section class="stats-grid"><div class="stat-card pixel-card"><div class="stat-label">累计经验</div><div class="stat-value gold">${state.xp} XP</div></div><div class="stat-card pixel-card"><div class="stat-label">当前连胜 / 最长连胜</div><div class="stat-value cyan">${state.streak} / ${state.bestStreak}</div></div><div class="stat-card pixel-card"><div class="stat-label">已探索词条 / 错题待回顾</div><div class="stat-value rose">${seen} / ${state.reviewIds.length}</div></div></section>
<div class="section-head"><div><h2>选择你的任务</h2><p>随时切换模式；每题都能回到原始材料查看完整上下文。</p></div></div><section class="quick-row"><article class="mini-card pixel-card"><div class="icon">⚔</div><h3>混合速刷</h3><p>随机抽 10 条，三种题型轮换；答错后看解析，再集中复习。</p></article><article class="mini-card pixel-card"><div class="icon">▦</div><h3>时间楼层</h3><p>按字幕时间顺序探索 23 层，每层覆盖该时间点的全部台词。</p></article><article class="mini-card pixel-card"><div class="icon">▤</div><h3>完整图鉴</h3><p>查找台词、词搭、释义和商务例句，也能打开原始 Markdown 存档。</p></article></section><div class="reset-row"><button class="tiny-button" data-action="reset">重置本机训练进度</button></div>`}
function renderMap(){const cards=DATA.chapters.map((chapter,index)=>{const practiced=chapter.entries.filter(entry=>(state.rowStats[entry.id]?.seen||0)>0).length;const cleared=state.clearedChapters.includes(chapter.timestamp);const percent=Math.round(practiced/chapter.entries.length*100);return `<article class="floor-card pixel-card"><div class="floor-top"><span class="floor-number">FLOOR ${String(index+1).padStart(2,"0")}</span><span>${cleared?"✦ CLEARED":"◇"}</span></div><h3>${esc(chapter.timestamp)}</h3><p>${chapter.entries.length} 条台词 · 已探索 ${practiced}</p><div class="progress-track" aria-label="${percent}% 已探索"><div class="progress-fill" style="width:${percent}%"></div></div><button class="button secondary" data-action="chapter" data-index="${index}">进入本层</button></article>`}).join("");return `<div class="eyebrow">QUEST MAP · 23 FLOORS</div><div class="section-head"><div><h1 style="font-size:clamp(32px,5vw,50px)">楼层探索</h1><p>依原材料时间戳排列；每层完整练习本组台词。</p></div><button class="button primary" data-action="quick">随机速刷</button></div><section class="map-grid">${cards}</section>`}
function renderLibrary(){const q=libraryQuery.trim().toLocaleLowerCase();const filtered=ALL_ENTRIES.filter(entry=>{const text=[entry.timestamp,entry.dialogue,entry.collocation,entry.meaning,entry.business].join(" ").toLocaleLowerCase();return(!q||text.includes(q))&&(!libraryCategory||categoryOf(entry.collocation)===libraryCategory)});const cards=filtered.length?filtered.map(entry=>`<article class="entry-card pixel-card"><div class="entry-meta"><span>⏱ ${esc(entry.timestamp)}</span>${categoryOf(entry.collocation)?`<span class="tag">${esc(categoryOf(entry.collocation))}</span>`:""}</div><div class="entry-field"><div class="field-name">动漫台词</div><div>${inlineMd(entry.dialogue)}</div></div><div class="entry-field"><div class="field-name">核心词搭＋分类</div><div>${inlineMd(entry.collocation)}</div></div><div class="entry-field"><div class="field-name">中文理解</div><div>${inlineMd(entry.meaning)}</div></div><div class="entry-field"><div class="field-name">商务例句</div><div>${inlineMd(entry.business)}</div></div></article>`).join(""):`<div class="empty-state pixel-card">没有找到匹配词条。试试台词、词搭、分类或时间戳。</div>`;return `<div class="eyebrow">COLLOCATION CODEX · ${filtered.length} / ${ALL_ENTRIES.length}</div><div class="section-head"><div><h1 style="font-size:clamp(32px,5vw,50px)">词搭图鉴</h1><p>所有原句、中文理解、词搭分类和商务例句都在这里。</p></div></div><div class="toolbar"><input id="library-search" type="search" placeholder="搜索台词、词搭、释义、商务例句…" value="${esc(libraryQuery)}" aria-label="搜索全部词条"><select id="library-category" aria-label="按分类筛选"><option value="">全部分类</option>${CATEGORIES.map(c=>`<option value="${esc(c)}" ${libraryCategory===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div><section class="library-list">${cards}</section><section class="appendix-card pixel-card">${markdownBlock(DATA.materials)}<hr style="border:0;border-top:1px solid var(--line);margin:24px 0">${markdownBlock(DATA.appendix)}</section><details class="archive"><summary>展开完整原文 Markdown 存档（保留原始章节、表格和说明）</summary><pre>${esc(DATA.source)}</pre></details><div class="reset-row"><button class="tiny-button" data-action="reset">重置本机训练进度</button></div>`}
function renderReviewHome(){const entries=state.reviewIds.map(id=>ENTRY_BY_ID.get(id)).filter(Boolean);const cards=entries.map(entry=>`<article class="entry-card pixel-card"><div class="entry-meta"><span>⏱ ${esc(entry.timestamp)}</span><span class="tag">待复习</span></div><div class="entry-field"><div class="field-name">动漫台词</div><div>${inlineMd(entry.dialogue)}</div></div><div class="entry-field"><div class="field-name">核心词搭</div><div>${inlineMd(entry.collocation)}</div></div><div class="entry-field"><div class="field-name">中文理解</div><div>${inlineMd(entry.meaning)}</div></div></article>`).join("");return `<div class="eyebrow">REVIEW QUEST</div><div class="section-head"><div><h1 style="font-size:clamp(32px,5vw,50px)">错题回顾</h1><p>答对任一题型后，该词条会从待复习清单移除。</p></div>${entries.length?`<button class="button primary" data-action="review">开始复习 ${entries.length} 条</button>`:""}</div>${entries.length?`<section class="library-list">${cards}</section>`:`<div class="empty-state pixel-card">目前没有待复习词条。去探索，遇到的难题会自动放进这里。</div>`}`}
function bindViewActions(){const search=document.getElementById("library-search");if(search)search.addEventListener("input",event=>{libraryQuery=event.target.value;const cursor=event.target.selectionStart;render();const next=document.getElementById("library-search");next.focus();next.setSelectionRange(cursor,cursor)});const category=document.getElementById("library-category");if(category)category.addEventListener("change",event=>{libraryCategory=event.target.value;render()})}
function handleAction(button){const action=button.dataset.action;if(action==="quick")startSession(shuffle(ALL_ENTRIES).slice(0,10),"quick");else if(action==="chapter"){const chapter=DATA.chapters[Number(button.dataset.index)];startSession(chapter.entries.map(entry=>({...entry,timestamp:chapter.timestamp})),"chapter")}else if(action==="map")setView("map");else if(action==="review")startSession(state.reviewIds.map(id=>ENTRY_BY_ID.get(id)).filter(Boolean),"review");else if(action==="next")nextQuestion();else if(action==="retry-missed")startSession(session.missed.map(id=>ENTRY_BY_ID.get(id)).filter(Boolean),"review");else if(action==="home")setView("home");else if(action==="library")setView("library");else if(action==="reset")resetProgress()}
function startSession(rows,mode){if(!rows.length){toast("当前没有可练习的词条。");return}const types=[];while(types.length<rows.length)types.push(...shuffle([0,1,2]));session={items:rows,types:types.slice(0,rows.length),index:0,mode,correct:0,missed:[],answered:false,done:false,current:null};view=mode==="review"?"review":mode==="chapter"?"map":"home";makeCurrentQuestion();render();window.scrollTo({top:0,behavior:"smooth"})}
function makeOptions(entry,field){const correct=entry[field],seen=new Set([norm(correct)]),distractors=[];for(const candidate of shuffle(ALL_ENTRIES)){const value=candidate[field],key=norm(value);if(!key||seen.has(key))continue;seen.add(key);distractors.push(value);if(distractors.length===3)break}return shuffle([correct,...distractors])}
function makeCurrentQuestion(){const entry=session.items[session.index],type=session.types[session.index],field=["meaning","collocation","business"][type];session.current={entry,type,field,options:makeOptions(entry,field)};session.answered=false}
function renderQuestion(){const{entry,type,options}=session.current;const labels=["这条词搭对应的中文理解是哪一项？","从台词中找出本条的核心词搭。","这条词搭对应的商务例句是哪一项？"];const prompt=type===0?`<div class="quote-line">${inlineMd(entry.collocation)}</div><p class="muted" style="margin:12px 0 0">原句：${inlineMd(entry.dialogue)}</p>`:type===1?`<div class="quote-line">${inlineMd(entry.dialogue)}</div>`:`<div class="quote-line">${inlineMd(entry.collocation)}<br><span class="muted" style="font-size:14px">${inlineMd(entry.meaning)}</span></div>`;const opts=options.map((option,index)=>{const right=norm(option)===norm(entry[session.current.field]),chosen=session.current.chosen===index;const status=session.answered&&right?"correct":session.answered&&chosen?"incorrect":"";return `<button class="answer-option ${status}" data-answer="${index}" ${session.answered?"disabled":""}>${String.fromCharCode(65+index)}. ${inlineMd(option)}</button>`}).join("");let feedback="";if(session.answered){const good=session.current.isCorrect;feedback=`<div class="feedback ${good?"good":"bad"}"><strong>${good?"✦ 命中！+10 XP":"◇ 已收录到错题回顾"}</strong><p><b>台词：</b>${inlineMd(entry.dialogue)}</p><p><b>词搭：</b>${inlineMd(entry.collocation)}</p><p><b>中文：</b>${inlineMd(entry.meaning)}</p><p><b>商务例句：</b>${inlineMd(entry.business)}</p></div>`}const chapter=session.mode==="quick"?"混合速刷":session.mode==="review"?"错题回顾":`楼层 ${DATA.chapters.findIndex(ch=>ch.timestamp===entry.timestamp)+1} · ${entry.timestamp}`;const percent=Math.round((session.index+(session.answered?1:0))/session.items.length*100);return `<div class="quiz-shell"><div class="quiz-top"><span>${esc(chapter)} · ${MODE_LABELS[type]}</span><span>${session.index+1} / ${session.items.length}</span></div><div class="quiz-track"><span style="width:${percent}%"></span></div><section class="question-card pixel-card"><div class="question-label">QUEST ${String(session.index+1).padStart(2,"0")} · ${MODE_LABELS[type]}</div><div class="question-prompt">${labels[type]}</div>${prompt}<div class="answer-list">${opts}</div>${feedback}<div class="quiz-footer"><span class="muted">时间戳 ${esc(entry.timestamp)} · 不计时</span>${session.answered?`<button class="button primary" data-action="next">${session.index+1===session.items.length?"查看结算":"下一题 →"}</button>`:`<button class="button ghost" data-action="home">退出本轮</button>`}</div></section></div>`}
function renderResults(){const total=session.items.length,percent=Math.round(session.correct/total*100),missed=session.missed.length;return `<section class="results-card pixel-card"><div class="eyebrow">QUEST COMPLETE</div><h1 style="font-size:clamp(32px,6vw,54px)">${session.mode==="review"?"复习完成！":"这一层清掉了！"}</h1><div class="results-score">${session.correct} / ${total}</div><p class="muted">本轮正确率 ${percent}% · ${missed?`还有 ${missed} 条加入错题回顾。`:"本轮全对，太稳了。"}</p><div class="results-actions">${missed?`<button class="button primary" data-action="retry-missed">再刷本轮错题</button>`:""}<button class="button secondary" data-action="quick">再来 10 题</button><button class="button ghost" data-action="home">回到大厅</button></div></section>`}
function answerQuestion(index){if(!session||session.answered)return;const current=session.current,correct=norm(current.options[index])===norm(current.entry[current.field]);current.chosen=index;current.isCorrect=correct;session.answered=true;const stats=state.rowStats[current.entry.id]||{seen:0,correct:0,wrong:0};stats.seen++;if(correct){session.correct++;state.correct++;state.xp+=10;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);stats.correct++;state.reviewIds=state.reviewIds.filter(id=>id!==current.entry.id)}else{state.wrong++;state.streak=0;stats.wrong++;if(!session.missed.includes(current.entry.id))session.missed.push(current.entry.id);if(!state.reviewIds.includes(current.entry.id))state.reviewIds.push(current.entry.id)}state.rowStats[current.entry.id]=stats;saveState();render()}
function nextQuestion(){if(!session||!session.answered)return;session.index++;if(session.index>=session.items.length){session.done=true;if(session.mode==="chapter"){const stamp=session.items[0]?.timestamp;if(stamp&&!state.clearedChapters.includes(stamp))state.clearedChapters.push(stamp)}saveState()}else makeCurrentQuestion();render()}
function resetProgress(){if(!confirm("要清除本浏览器保存的经验、楼层进度和错题吗？原始学习材料不会删除。"))return;Object.assign(state,freshState());try{localStorage.removeItem(STORAGE_KEY)}catch(error){}session=null;view="home";render();toast("训练进度已重置，学习材料仍然保留。")}
document.querySelectorAll(".nav [data-view]").forEach(button=>button.addEventListener("click",()=>setView(button.dataset.view)));
document.getElementById("app").addEventListener("click",event=>{const answer=event.target.closest("[data-answer]");if(answer){answerQuestion(Number(answer.dataset.answer));return}const action=event.target.closest("[data-action]");if(action)handleAction(action)});
try{render()}catch(error){document.getElementById("app").innerHTML="<div class='notice'>页面启动时遇到问题。你仍可在 HTML 原文存档中查看材料。</div>"}
</script>
</body>
</html>
